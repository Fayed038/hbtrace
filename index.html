<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HBtrace — Location Check-in</title>
<style>
:root{
  --home:#1e88e5; --home-dark:#1565c0;
  --sales:#e65100; --sales-dark:#bf360c;
  --ok:#2e7d32; --err:#c62828; --bg:#f4f6f8; --card:#fff; --text:#222; --muted:#666;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Segoe UI',system-ui,Roboto,Arial,'Noto Sans Bengali',sans-serif;
  background:var(--bg);color:var(--text);line-height:1.4}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 40px}
header{text-align:center;padding:14px 0 6px}
header h1{margin:0;font-size:26px;letter-spacing:.5px;color:#111}
header .sub{color:var(--muted);font-size:13px;margin-top:2px}
.card{background:var(--card);border-radius:14px;padding:18px;margin-top:16px;
  box-shadow:0 1px 4px rgba(0,0,0,.08)}
label{display:block;font-weight:600;font-size:15px;margin:0 0 6px}
label .en{display:block;font-weight:400;font-size:12px;color:var(--muted)}
input{width:100%;padding:14px;font-size:17px;border:1.5px solid #d0d5db;
  border-radius:10px;background:#fff;-webkit-appearance:none;appearance:none}
input:focus{outline:none;border-color:var(--home)}
textarea{width:100%;padding:14px;font-size:17px;border:1.5px solid #d0d5db;border-radius:10px;
  margin-top:6px;min-height:56px;resize:vertical}
textarea:focus{outline:none;border-color:var(--home)}
.search-box{position:relative}
.results{position:absolute;z-index:20;left:0;right:0;background:#fff;border:1.5px solid #d0d5db;
  border-top:none;border-radius:0 0 10px 10px;max-height:280px;overflow:auto;
  box-shadow:0 8px 20px rgba(0,0,0,.14)}
.results div{padding:13px 14px;cursor:pointer;font-size:16px;border-bottom:1px solid #f1f3f4}
.results div:active,.results .active{background:#e8f0fe}
.results small{color:var(--muted);font-size:13px}
.hide{display:none}
.who{margin-top:14px;background:#eef6ee;border:1px solid #cfe8cf;border-radius:12px;padding:14px}
.who .nm{font-weight:700;font-size:18px}
.who .rows{margin-top:8px;font-size:14px}
.who .rows div{margin:3px 0}
.who b{display:inline-block;min-width:96px;color:#4b5563}
.change{display:inline-block;margin-top:10px;color:var(--home);font-weight:600;font-size:14px;cursor:pointer}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:100%;padding:22px;font-size:20px;font-weight:700;color:#fff;border:none;
  border-radius:14px;margin-bottom:14px;cursor:pointer;line-height:1.25}
.btn small{font-weight:500;font-size:14px;opacity:.95;margin-top:3px}
.btn:active{transform:scale(.99)}
.btn.home{background:var(--home)}.btn.home:active{background:var(--home-dark)}
.btn.sales{background:var(--sales)}.btn.sales:active{background:var(--sales-dark)}
.btn:disabled{opacity:.5}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:2px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;
  align-items:center;justify-content:center;padding:16px;z-index:10}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:22px;max-width:420px;width:100%;text-align:center}
.modal h2{margin:0 0 4px;font-size:20px}
.modal .en2{color:var(--muted);font-size:13px;margin-bottom:14px}
.kv{background:#f4f6f8;border-radius:10px;padding:12px;text-align:left;font-size:14px;margin-bottom:8px}
.kv div{margin:3px 0}.kv b{display:inline-block;min-width:96px;vertical-align:top}
.acc{font-size:12px;color:var(--muted);margin-bottom:16px}
.muted-i{color:var(--muted);font-style:italic}
#addrLine{word-break:break-word}
.spin{width:42px;height:42px;border:4px solid #ddd;border-top-color:var(--home);
  border-radius:50%;animation:sp 1s linear infinite;margin:10px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.row{display:flex;gap:10px}.row .btn{flex:1;padding:16px;font-size:17px}
.btn.grey{background:#607d8b}.btn.grey:active{background:#455a64}
.btn.green{background:var(--ok)}.btn.green:active{background:#1b5e20}
.big-ok{font-size:54px;line-height:1;margin:6px 0}
.msg-ok{color:var(--ok);font-weight:700;font-size:19px;margin:6px 0 2px}
.msg-err{color:var(--err);font-weight:700;font-size:18px;margin:6px 0}
.pill{display:inline-block;padding:4px 12px;border-radius:20px;font-size:13px;
  font-weight:700;color:#fff;margin-bottom:8px}
.pill.home{background:var(--home)}.pill.sales{background:var(--sales)}
.steps{text-align:left;background:#f4f6f8;border-radius:10px;padding:12px 12px 4px;margin:6px 0 16px}
.steps-title{font-weight:700;font-size:14px;margin:8px 0 4px}
.steps ol{margin:0 0 8px;padding-left:22px}.steps li{font-size:14px;margin:0 0 8px}
.steps .en2{font-size:12px;margin:0}
.warn-note{text-align:left;background:#fff3e0;border:1px solid #ffb74d;border-radius:10px;
  padding:10px 12px;margin:10px 0;font-size:14px;font-weight:600;color:#8a4b00}
.warn-note .en2{font-weight:400}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>HBtrace</h1>
    <div class="sub">অবস্থান নিশ্চিত করুন • Location Check-in</div>
  </header>

  <div class="card">
    <label>আপনার নাম খুঁজুন <span class="en">Search &amp; select your name</span></label>
    <div class="search-box">
      <input id="search" type="text" autocomplete="off" placeholder="নাম টাইপ করুন / Type your name…">
      <div id="results" class="results hide"></div>
    </div>
    <div id="loadingRoster" class="hint" style="margin-top:8px">তালিকা লোড হচ্ছে… / Loading names…</div>

    <div id="who" class="who hide">
      <div class="nm" id="whoName"></div>
      <div class="rows" id="whoRows"></div>
      <span class="change" id="changeName">✎ নাম পরিবর্তন / Change name</span>
    </div>

    <div id="noteWrap" class="hide">
      <label style="margin-top:16px">মন্তব্য (ঐচ্ছিক) <span class="en">Note (optional)</span></label>
      <textarea id="note" placeholder="ডিপো নাম / মন্তব্য — Depot name / remark"></textarea>
    </div>
  </div>

  <div class="card" id="actions">
    <button class="btn home" id="btnHome" disabled onclick="capture('HOME')">
      🏠 আমি এখন বাসায় আছি <small>I am at HOME now</small>
    </button>
    <button class="btn sales" id="btnSales" disabled onclick="capture('SALESPOINT')">
      🏪 আমি এখন সেলসপয়েন্টে আছি <small>I am at SALESPOINT now</small>
    </button>
    <p class="hint">আগে নাম নির্বাচন করুন, তারপর বোতামে চাপ দিন।<br>Select your name first, then tap a button.</p>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
/* ============================================================
   HBtrace front-end (GitHub Pages) — no OTP.
   Identity is not typed: pick your name, everything auto-fills.
   Each submit carries a persistent DEVICE id + public IP so a
   phone used for many people (proxy check-ins) is caught server-side.
   >>> Paste your Apps Script /exec URL below after deploying Code.gs.
   ============================================================ */
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzgPUmSiKzvERlwIBTpQDzRap2igqPZmFCSJYDJHmo4rn_UG2VnEFSe-pI2T4_t7eJY/exec";

var ROSTER = [], selected = null, IP = '';
var DEVICE = getDevice();

function getDevice(){
  try{
    var k='hbtrace_device', v=localStorage.getItem(k);
    if(!v){ v = Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10); localStorage.setItem(k,v); }
    return v;
  }catch(e){ return 'nodev-'+Math.random().toString(36).slice(2,10); }
}
function $(id){ return document.getElementById(id); }
function val(id){ var e=$(id); return e?e.value.trim():''; }
function esc(s){ return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

/* ---- public IP (best-effort) ---- */
(function fetchIp(){
  try{
    fetch('https://api.ipify.org?format=json').then(function(r){return r.json();})
      .then(function(d){ IP=(d&&d.ip)||''; }).catch(function(){ IP=''; });
  }catch(e){ IP=''; }
})();

/* ---- load roster via JSONP (works cross-origin from GitHub Pages) ---- */
function loadRoster(){
  window.__hbRoster = function(res){
    $('loadingRoster').classList.add('hide');
    if(res && res.ok && res.roster){ ROSTER = res.roster; }
    else { $('loadingRoster').textContent='তালিকা লোড ব্যর্থ / Could not load names'; $('loadingRoster').classList.remove('hide'); }
  };
  var s=document.createElement('script');
  s.src=SCRIPT_URL+'?action=roster&callback=__hbRoster&t='+Date.now();
  s.onerror=function(){ $('loadingRoster').textContent='তালিকা লোড ব্যর্থ / Could not load names'; };
  document.body.appendChild(s);
}
loadRoster();

/* ---- typeahead search ---- */
var searchEl=$('search'), resEl=$('results'), active=-1, filtered=[];
searchEl.addEventListener('input', function(){
  var q=this.value.trim().toLowerCase();
  selected=null; syncButtons();
  if(!q){ resEl.classList.add('hide'); return; }
  filtered=ROSTER.filter(function(p){ return p.name.toLowerCase().indexOf(q)!==-1; }).slice(0,40);
  renderResults();
});
searchEl.addEventListener('keydown', function(e){
  if(resEl.classList.contains('hide')) return;
  if(e.key==='ArrowDown'){ active=Math.min(active+1,filtered.length-1); paint(); e.preventDefault(); }
  else if(e.key==='ArrowUp'){ active=Math.max(active-1,0); paint(); e.preventDefault(); }
  else if(e.key==='Enter'){ if(filtered[active]) pick(filtered[active]); e.preventDefault(); }
});
function renderResults(){
  active=-1;
  if(!filtered.length){ resEl.innerHTML='<div><small>মিল নেই / No match</small></div>'; resEl.classList.remove('hide'); return; }
  resEl.innerHTML=filtered.map(function(p,i){
    return '<div data-i="'+i+'">'+esc(p.name)+
      ' <small>'+esc(p.designation)+(p.territory?(' · '+esc(p.territory)):(p.area?(' · '+esc(p.area)):''))+'</small></div>';
  }).join('');
  Array.prototype.forEach.call(resEl.children,function(d){
    d.onclick=function(){ pick(filtered[+d.getAttribute('data-i')]); };
  });
  resEl.classList.remove('hide');
}
function paint(){ Array.prototype.forEach.call(resEl.children,function(d,i){ d.className=(i===active)?'active':''; }); }

function pick(p){
  selected=p;
  searchEl.value=p.name; resEl.classList.add('hide');
  $('whoName').textContent=p.name;
  var rows='';
  rows+='<div><b>পদবি / Role:</b> '+esc(p.designation||'—')+'</div>';
  if(p.region)    rows+='<div><b>রিজিয়ন / Region:</b> '+esc(p.region)+'</div>';
  if(p.area)      rows+='<div><b>এরিয়া / Area:</b> '+esc(p.area)+'</div>';
  if(p.territory) rows+='<div><b>টেরিটরি / Territory:</b> '+esc(p.territory)+'</div>';
  rows+='<div><b>মোবাইল / Mobile:</b> '+esc(p.numberMasked||'—')+'</div>';
  $('whoRows').innerHTML=rows;
  $('who').classList.remove('hide'); $('noteWrap').classList.remove('hide');
  if(!p.hasNumber){
    show(errBox('আপনার কর্পোরেট নম্বর তালিকায় নেই — এডমিনকে জানান।',
      'No corporate number on file for you — contact admin.'));
  }
  syncButtons();
}
$('changeName').onclick=function(){
  selected=null; searchEl.value=''; $('who').classList.add('hide');
  $('noteWrap').classList.add('hide'); syncButtons(); searchEl.focus();
};
function syncButtons(){
  var ok=!!(selected && selected.hasNumber);
  $('btnHome').disabled=!ok; $('btnSales').disabled=!ok;
}

/* ============ GPS capture / confirm / submit (with recovery) ========= */
var overlay=$('overlay'), modal=$('modal'), pending=null, lastType=null;
var awaitingPermission=false, permStatus=null, blockedRetries=0;
function show(html){ modal.innerHTML=html; overlay.classList.add('show'); }
function close(){ overlay.classList.remove('show'); pending=null; awaitingPermission=false; }
function labelFor(t){ return t==='HOME'?'বাসা / HOME':'সেলসপয়েন্ট / SALESPOINT'; }
function pillClass(t){ return t==='HOME'?'home':'sales'; }

if(navigator.permissions && navigator.permissions.query){
  navigator.permissions.query({name:'geolocation'}).then(function(st){
    permStatus=st;
    st.onchange=function(){ if(st.state==='granted' && awaitingPermission){ awaitingPermission=false; doCapture(lastType); } };
  }).catch(function(){});
}
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible' && awaitingPermission && navigator.permissions && navigator.permissions.query){
    navigator.permissions.query({name:'geolocation'}).then(function(st){
      if(st.state==='granted'){ awaitingPermission=false; doCapture(lastType); }
    }).catch(function(){});
  }
});

function capture(type){
  blockedRetries=0;
  if(!selected){ show(errBox('আগে নাম নির্বাচন করুন।','Please select your name first.')); return; }
  if(!selected.hasNumber){ show(errBox('আপনার নম্বর তালিকায় নেই।','No number on file — contact admin.')); return; }
  if(!navigator.geolocation){ show(errBox('এই ডিভাইসে GPS সমর্থিত নয়।','GPS is not supported on this device.')); return; }
  lastType=type; doCapture(type);
}
function doCapture(type){
  lastType=type;
  show('<h2>অবস্থান নেওয়া হচ্ছে…</h2><div class="en2">Getting your location…</div>'+
    '<div class="spin"></div><p class="hint">অনুমতি চাইলে "Allow" চাপুন।<br>If asked, tap "Allow".</p>');
  navigator.geolocation.getCurrentPosition(function(pos){
    awaitingPermission=false; blockedRetries=0;
    pending={ type:type, lat:pos.coords.latitude, lon:pos.coords.longitude, acc:pos.coords.accuracy, address:null };
    confirmStep(); fetchAddress();
  }, function(err){
    if(err.code===1){ awaitingPermission=true; blockedRetries++; show(permissionDeniedBox(blockedRetries>1)); return; }
    var m='অবস্থান পাওয়া যায়নি।', e='Could not get location.';
    if(err.code===3){ m='সময় শেষ, আবার চেষ্টা করুন।'; e='Timed out. Please try again.'; }
    show(errBox(m,e,false,true));
  }, { enableHighAccuracy:true, timeout:20000, maximumAge:0 });
}
function retryCapture(){ if(!lastType) lastType='HOME'; doCapture(lastType); }

function permissionDeniedBox(stillBlocked){
  var note = stillBlocked
    ? '<div class="warn-note">⚠️ এখনো বন্ধ — আগে নিচের ধাপগুলো করুন, তারপর Try Again চাপুন।<br>'+
      '<span class="en2">Still blocked — complete the steps below first, then tap Try Again.</span></div>' : '';
  return '<h2 class="msg-err">⚠️ অবস্থানের অনুমতি বন্ধ</h2><div class="en2">Location permission is blocked</div>'+note+
    '<p style="text-align:left">নিচের যেকোনো একটি উপায়ে অনুমতি চালু করুন।<br><span class="en2">Re-enable location using one of the methods below.</span></p>'+
    '<div class="steps"><div class="steps-title">📱 Chrome (Android)</div><ol>'+
    '<li>ঠিকানা বারের বাঁ পাশে <b>🔒 / ⓘ</b> আইকনে চাপ দিন<br><span class="en2">Tap the <b>lock / ⓘ icon</b> left of the address bar</span></li>'+
    '<li><b>Permissions → Location → Allow</b></li></ol>'+
    '<div class="steps-title">⚙️ Fallback (phone Settings)</div><ol>'+
    '<li><b>Settings → Apps → Chrome</b></li><li><b>Permissions → Location → Allow</b></li>'+
    '<li>এই পেজে ফিরে আসুন<br><span class="en2">Return to this page</span></li></ol></div>'+
    '<button class="btn green" onclick="retryCapture()">🔄 আবার চেষ্টা করুন<small>Try Again</small></button>'+
    '<button class="btn grey" onclick="close()">বাতিল / Cancel</button>';
}

function confirmStep(){
  var p=pending, s=selected, loc='';
  if(s.region)    loc+='<div><b>রিজিয়ন / Region:</b> '+esc(s.region)+'</div>';
  if(s.area)      loc+='<div><b>এরিয়া / Area:</b> '+esc(s.area)+'</div>';
  if(s.territory) loc+='<div><b>টেরিটরি / Territory:</b> '+esc(s.territory)+'</div>';
  show('<span class="pill '+pillClass(p.type)+'">'+labelFor(p.type)+'</span>'+
    '<h2>এটা কি ঠিক আছে?</h2><div class="en2">Please confirm before submitting</div>'+
    '<div class="kv"><div><b>নাম / Name:</b> '+esc(s.name)+'</div>'+
    '<div><b>পদবি / Role:</b> '+esc(s.designation||'—')+'</div>'+loc+
    '<div id="addrLine"><b>ঠিকানা / Address:</b> '+(p.address?esc(p.address):'<span class="muted-i">লোড হচ্ছে… / loading…</span>')+'</div>'+
    '<div><b>Lat:</b> '+p.lat.toFixed(6)+'</div><div><b>Lon:</b> '+p.lon.toFixed(6)+'</div></div>'+
    '<div class="acc">📍 নির্ভুলতা / Accuracy: ± '+Math.round(p.acc)+' m</div>'+
    '<div class="row"><button class="btn grey" onclick="close()">বাতিল<small>Cancel</small></button>'+
    '<button class="btn green" onclick="submit()">নিশ্চিত করুন<small>Confirm &amp; Submit</small></button></div>');
}

function fetchAddress(){
  var p=pending; if(!p) return;
  var url='https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1'+
    '&lat='+encodeURIComponent(p.lat)+'&lon='+encodeURIComponent(p.lon);
  fetch(url,{headers:{'Accept':'application/json'}}).then(function(r){return r.json();})
    .then(function(d){ if(!pending) return; pending.address=(d&&d.display_name)||null;
      updateAddrLine(pending.address||'⚠️ ঠিকানা পাওয়া যায়নি / address unavailable'); })
    .catch(function(){ if(!pending) return; updateAddrLine('⚠️ ঠিকানা পাওয়া যায়নি / address unavailable'); });
}
function updateAddrLine(t){ var el=$('addrLine'); if(el) el.innerHTML='<b>ঠিকানা / Address:</b> '+esc(t); }

function submit(){
  var p=pending; if(!p||!selected) return;
  var payload={
    personId:selected.id, type:p.type,
    lat:p.lat, lon:p.lon, accuracy:Math.round(p.acc),
    address:p.address||'', note:val('note'),
    device:DEVICE, ip:IP, ua:navigator.userAgent,
    timestamp:new Date().toISOString()
  };
  show('<h2>পাঠানো হচ্ছে…</h2><div class="en2">Submitting…</div><div class="spin"></div>');
  fetch(SCRIPT_URL,{ method:'POST', mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload) })
    .then(function(){ successStep(p.type); })
    .catch(function(){ show(errBox('পাঠানো যায়নি, ইন্টারনেট চেক করে আবার চেষ্টা করুন।',
      'Could not submit. Check your internet and try again.', true)); });
}
function successStep(type){
  var loc=type==='HOME'?'বাসার / HOME':'সেলসপয়েন্টের / SALESPOINT';
  show('<div class="big-ok">✅</div>'+
    '<div class="msg-ok">ধন্যবাদ! আপনার '+loc+' অবস্থান সংরক্ষণ করা হয়েছে।</div>'+
    '<p>Thank you, your '+(type==='HOME'?'HOME':'SALESPOINT')+' location has been saved.</p>'+
    '<button class="btn green" onclick="reset()">সম্পন্ন / Done</button>');
}
function errBox(bn,en,retry,geoRetry){
  var b;
  if(retry){ b='<div class="row"><button class="btn grey" onclick="close()">বাতিল<small>Cancel</small></button>'+
    '<button class="btn green" onclick="submit()">আবার চেষ্টা<small>Retry</small></button></div>'; }
  else if(geoRetry){ b='<div class="row"><button class="btn grey" onclick="close()">বাতিল<small>Cancel</small></button>'+
    '<button class="btn green" onclick="retryCapture()">আবার চেষ্টা<small>Try Again</small></button></div>'; }
  else { b='<button class="btn grey" onclick="close()">ঠিক আছে / OK</button>'; }
  return '<h2 class="msg-err">⚠️ ত্রুটি</h2><p>'+bn+'<br><span class="en2">'+en+'</span></p>'+b;
}
function reset(){ $('note').value=''; close(); }
</script>
